[build]
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/plot"
  to = "/plot.html"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/data/models.json"
  status = 200

[[redirects]]
  from = "/api/live_telemetry"
  to = "/data/telemetry.json"
  status = 200

[[redirects]]
  from = "/api/forecast"
  to = "/data/forecast.json"
  status = 200

# Optional: If you connect a live Python backend on Render, Railway, or Fly.io:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-FLASK-BACKEND.onrender.com/api/:splat"
#   status = 200
