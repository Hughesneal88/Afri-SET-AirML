[build]
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/plot"
  to = "/plot.html"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/models"
  to = "/data/models.json"
  status = 200

[[redirects]]
  from = "/api/live_telemetry"
  to = "/data/telemetry.json"
  status = 200

[[redirects]]
  from = "/api/forecast"
  to = "/.netlify/functions/forecast"
  status = 200

[[redirects]]
  from = "/api/readings"
  to = "/.netlify/functions/readings"
  status = 200

[[redirects]]
  from = "/api/auth/generate-key"
  to = "/.netlify/functions/generate-key"
  status = 200

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/me"
  to = "/.netlify/functions/me"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/history"
  to = "/history.html"
  status = 200

# Optional: If you connect a live Python backend on Render, Railway, or Fly.io:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-FLASK-BACKEND.onrender.com/api/:splat"
#   status = 200
