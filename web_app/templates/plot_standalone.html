<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSense v2 · High-Precision Time-Series Analytics</title>
    
    <!-- Google Fonts: Plus Jakarta Sans & Azeret Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 12%, #18365c 0%, #0d2039 45%, #060e1a 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Top Frosted Floating Navigation Bar ── */
        .plot-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: rgba(10, 22, 38, 0.82);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            flex-wrap: wrap;
            gap: 14px;
            z-index: 20;
        }

        .plot-brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .plot-brand-gem {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 17px;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.45);
        }

        .plot-brand-text {
            display: flex;
            flex-direction: column;
        }

        .plot-brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .plot-brand-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.18);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #38bdf8;
            letter-spacing: 0.5px;
        }

        .plot-brand-sub {
            font-size: 11.5px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .brand-sep {
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── Controls Toolbar ── */
        .plot-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .control-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .plot-select {
            background: rgba(15, 28, 48, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(16px);
            border-radius: 9999px;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 12.5px;
            font-weight: 500;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .plot-select:hover, .plot-select:focus {
            border-color: #38bdf8;
            background: rgba(22, 42, 70, 0.9);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.25);
        }

        .plot-select option {
            background: #0f1c30;
            color: #f8fafc;
        }

        .plot-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        .plot-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.45);
            background: linear-gradient(135deg, #0ea5e9 0%, #1d4ed8 100%);
        }

        .plot-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: none;
        }

        .plot-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.35);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* ── Statistical Metric Strip (KPIs) ── */
        .plot-stats-strip {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 24px;
            background: rgba(9, 18, 31, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
            flex-wrap: wrap;
            z-index: 15;
        }

        .stat-card-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: rgba(16, 32, 54, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            font-size: 11.5px;
            color: #94a3b8;
        }

        .stat-card-pill i {
            color: #38bdf8;
            font-size: 11px;
        }

        .stat-val {
            font-family: 'Azeret Mono', monospace;
            font-weight: 700;
            color: #38bdf8;
            font-size: 12.5px;
        }

        /* ── Fullscreen Interactive Canvas ── */
        .plot-canvas-stage {
            flex: 1;
            position: relative;
            width: 100%;
            height: calc(100vh - 110px);
            padding: 8px 12px 12px 12px;
        }

        .plot-glass-frame {
            width: 100%;
            height: 100%;
            border-radius: 18px;
            background: rgba(8, 17, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        #fullscreenPlot {
            width: 100%;
            height: 100%;
        }

        .spinner-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(7, 15, 26, 0.88);
            backdrop-filter: blur(12px);
            font-size: 14px;
            color: #94a3b8;
            z-index: 25;
            transition: opacity 0.3s ease;
        }

        .spinner-overlay i {
            color: #38bdf8;
        }

        /* ── Responsive Adaptations ── */
        @media (max-width: 900px) {
            body { overflow-y: auto; }
            .plot-header { padding: 12px 16px; }
            .plot-controls { width: 100%; justify-content: flex-start; }
            .plot-stats-strip { padding: 8px 16px; }
            .plot-canvas-stage { height: 75vh; }
        }

        @media (max-width: 600px) {
            .plot-brand-sub { display: none; }
            .plot-controls { flex-direction: column; align-items: stretch; }
            .plot-select, .plot-btn { width: 100%; justify-content: center; }
            .plot-stats-strip { gap: 6px; }
            .stat-card-pill { width: calc(50% - 3px); justify-content: space-between; }
        }
    </style>
</head>
<body>

    <!-- ── Atmospheric Header ── -->
    <header class="plot-header">
        <div class="plot-brand-group">
            <div class="plot-brand-gem"><i class="fa-solid fa-wind"></i></div>
            <div class="plot-brand-text">
                <div class="plot-brand-title">
                    <span>MODULAIR PM</span>
                    <span class="plot-brand-badge">AirSense v2</span>
                </div>
                <div class="plot-brand-sub">
                    <span>High-Precision Analytics</span>
                    <span class="brand-sep">·</span>
                    <span>Station MOD-PM-01068</span>
                </div>
            </div>
        </div>

        <div class="plot-controls">
            <select id="pModelSelect" class="plot-select" title="Select ML Calibration Model">
                <option value="stacked_physics_meta_ensemble" selected>🏆 SPIME v4 Meta-Ensemble</option>
                <option value="random_forest_pm25_model_update2">Random Forest Regressor v2</option>
                <option value="two_stage_purged_calibrator">Two-Stage Purged Calibrator</option>
                <option value="pmc_hybrid_calibrator">PMC Hybrid Calibrator</option>
                <option value="moe_expert_model">Atmospheric MoE</option>
                <option value="compact_generalization_rf">Compact Generalization RF</option>
            </select>

            <select id="pSplitSelect" class="plot-select" title="Select Partition Split">
                <option value="val" selected>Validation Split</option>
                <option value="test">Holdout Test Split (Unseen 2025)</option>
                <option value="all">Full Dataset Horizon</option>
            </select>

            <select id="pPointsSelect" class="plot-select" title="Select Downsampling Granularity">
                <option value="500">500 Points (Smooth)</option>
                <option value="1500" selected>1,500 Points (High Res)</option>
                <option value="5000">5,000 Points (Full Detail)</option>
            </select>

            <button id="pRefreshBtn" class="plot-btn"><i class="fa-solid fa-arrows-rotate"></i> Update</button>
            <button id="pDownloadBtn" class="plot-btn plot-btn-secondary"><i class="fa-solid fa-camera"></i> PNG Export</button>
            <a href="/" class="plot-btn plot-btn-secondary" title="Return to AirSense Studio Homepage"><i class="fa-solid fa-arrow-left"></i> Return to Studio</a>
        </div>
    </header>

    <!-- ── Statistical Metric Strip ── -->
    <div class="plot-stats-strip">
        <div class="stat-card-pill">
            <i class="fa-solid fa-chart-pie"></i>
            <span>R² Goodness of Fit:</span>
            <span class="stat-val" id="pR2">--</span>
        </div>
        <div class="stat-card-pill">
            <i class="fa-solid fa-ruler"></i>
            <span>MAE:</span>
            <span class="stat-val" id="pMAE">--</span>
        </div>
        <div class="stat-card-pill">
            <i class="fa-solid fa-wave-square"></i>
            <span>RMSE:</span>
            <span class="stat-val" id="pRMSE">--</span>
        </div>
        <div class="stat-card-pill">
            <i class="fa-solid fa-compass"></i>
            <span>Mean Bias:</span>
            <span class="stat-val" id="pBias">--</span>
        </div>
        <div class="stat-card-pill">
            <i class="fa-solid fa-database"></i>
            <span>Samples:</span>
            <span class="stat-val" id="pSamples">--</span>
        </div>
    </div>

    <!-- ── Plot Canvas Stage ── -->
    <div class="plot-canvas-stage">
        <div class="plot-glass-frame">
            <div class="spinner-overlay" id="pSpinner">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x"></i>
                <span>Loading High-Resolution Environmental Time-Series...</span>
            </div>
            <div id="fullscreenPlot"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const initialModel = urlParams.get('model_key') || 'stacked_physics_meta_ensemble';
        let initialSplit = urlParams.get('split') || 'val';
        if (initialSplit === 'holdout') initialSplit = 'test';
        if (initialSplit === 'full') initialSplit = 'all';

        const modelSelect = document.getElementById('pModelSelect');
        const splitSelect = document.getElementById('pSplitSelect');
        const pointsSelect = document.getElementById('pPointsSelect');
        const refreshBtn = document.getElementById('pRefreshBtn');
        const downloadBtn = document.getElementById('pDownloadBtn');
        const spinner = document.getElementById('pSpinner');

        if (initialModel && modelSelect) modelSelect.value = initialModel;
        if (initialSplit && splitSelect) splitSelect.value = initialSplit;

        // Dynamically load models registry
        async function loadModelsRegistry() {
            try {
                const res = await fetch('/api/models');
                if (!res.ok) return;
                const data = await res.json();
                if (data.models && data.models.length > 0) {
                    const currentVal = modelSelect.value;
                    modelSelect.innerHTML = '';
                    data.models.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.key;
                        opt.textContent = m.name;
                        if (m.key === currentVal || (m.key === initialModel && !currentVal)) {
                            opt.selected = true;
                        }
                        modelSelect.appendChild(opt);
                    });
                }
            } catch (e) {
                console.warn('Could not populate model registry:', e);
            }
        }
        loadModelsRegistry();

        async function fetchAndRender() {
            spinner.style.display = 'flex';
            const modelKey = modelSelect.value;
            const split = splitSelect.value;
            const maxPoints = pointsSelect.value;

            try {
                const res = await fetch(`/api/predict?model_key=${modelKey}&split=${split}&max_points=${maxPoints}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.metrics) {
                    document.getElementById('pR2').textContent = data.metrics.r2?.toFixed(4) ?? '--';
                    document.getElementById('pMAE').textContent = `${data.metrics.mae?.toFixed(2) ?? '--'} µg/m³`;
                    document.getElementById('pRMSE').textContent = `${data.metrics.rmse?.toFixed(2) ?? '--'} µg/m³`;
                    document.getElementById('pBias').textContent = `${data.metrics.bias?.toFixed(2) ?? '--'} µg/m³`;
                    document.getElementById('pSamples').textContent = data.metrics.sample_count?.toLocaleString() ?? '--';
                }

                const traceRef = {
                    x: data.timestamps,
                    y: data.actuals || [],
                    mode: 'lines',
                    name: 'Reference Ground Truth (BAM)',
                    line: { color: '#38bdf8', width: 2 }
                };

                const traceRaw = {
                    x: data.timestamps,
                    y: data.raw_pm25 || [],
                    mode: 'lines',
                    name: 'Raw Sensor PM2.5 (Uncalibrated OPC)',
                    line: { color: '#fb923c', width: 1.2, dash: 'dot' }
                };

                const traceCal = {
                    x: data.timestamps,
                    y: data.predictions || [],
                    mode: 'lines',
                    name: `Calibrated (${data.model_name || 'SPIME v4'})`,
                    line: { color: '#34d399', width: 2.2 }
                };

                const layout = {
                    paper_bgcolor: 'transparent',
                    plot_bgcolor: 'transparent',
                    margin: { l: 60, r: 35, t: 30, b: 60 },
                    legend: { orientation: 'h', y: 1.05, font: { color: '#e2e8f0', size: 12 } },
                    xaxis: {
                        color: '#cbd5e1',
                        gridcolor: 'rgba(255,255,255,0.08)',
                        showspikes: true,
                        spikemode: 'across',
                        spikesnap: 'cursor',
                        spikethickness: 1,
                        spikedash: 'dot',
                        spikecolor: '#38bdf8',
                        title: { text: 'Timestamp (UTC)', font: { size: 12, color: '#94a3b8' } }
                    },
                    yaxis: {
                        color: '#cbd5e1',
                        gridcolor: 'rgba(255,255,255,0.08)',
                        showspikes: true,
                        spikemode: 'across',
                        spikesnap: 'cursor',
                        spikethickness: 1,
                        spikedash: 'dot',
                        spikecolor: '#34d399',
                        title: { text: 'PM2.5 Concentration (µg/m³)', font: { size: 13, color: '#e2e8f0' } }
                    },
                    hovermode: 'x unified'
                };

                const config = {
                    responsive: true,
                    displayModeBar: true,
                    modeBarButtonsToRemove: ['lasso2d', 'select2d']
                };

                Plotly.newPlot('fullscreenPlot', [traceRef, traceRaw, traceCal], layout, config);
            } catch (err) {
                console.error('Error fetching time-series prediction:', err);
            } finally {
                spinner.style.display = 'none';
            }
        }

        modelSelect.addEventListener('change', fetchAndRender);
        splitSelect.addEventListener('change', fetchAndRender);
        pointsSelect.addEventListener('change', fetchAndRender);
        refreshBtn.addEventListener('click', fetchAndRender);

        downloadBtn.addEventListener('click', () => {
            Plotly.downloadImage('fullscreenPlot', {
                format: 'png',
                width: 1920,
                height: 1080,
                filename: `AirSense_TimeSeries_${modelSelect.value}_${splitSelect.value}`
            });
        });

        window.addEventListener('resize', () => {
            Plotly.Plots.resize('fullscreenPlot');
        });

        fetchAndRender();
    </script>
</body>
</html>
